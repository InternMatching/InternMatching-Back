name: keepalive

# Ping /health every 5 minutes to prevent Render free-tier suspension
# and keep the MongoDB Atlas connection warm (/health pings Mongo).
#
# Note: GitHub Actions cron uses UTC and can be delayed during high load.
# In practice this fires every 5–15 minutes, which is fine for a 15-min
# Render idle window. Scheduled workflows only run from the default branch.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping backend /health
        env:
          HEALTH_URL: https://internmatching-back.onrender.com/health
        run: |
          set -e
          echo "Pinging $HEALTH_URL"
          # Render cold start can take ~30s; allow up to 60s for the first wake.
          response=$(curl -sS --max-time 60 -w "\n%{http_code}" "$HEALTH_URL")
          body=$(echo "$response" | sed '$d')
          status=$(echo "$response" | tail -n1)
          echo "HTTP $status"
          echo "$body"
          if [ "$status" != "200" ]; then
            echo "Unhealthy response (status=$status)"
            exit 1
          fi
